# =========================================================
# Config cho PostgREST - sua lai thong tin ket noi cho dung voi may ban
# Chay: postgrest postgrest.conf
# =========================================================

# Chuoi ket noi Postgres (sua user/password/host/port/dbname cho dung)
db-uri = "postgres://postgres:dong123456N@localhost:5432/FD1"

# Schema se duoc expose thanh API
db-schemas = "fd_tool"

# Role dung khi goi API (da tao trong file 03_api.sql)
db-anon-role = "web_anon"

# Cong ma PostgREST se lang nghe -> Postman goi vao http://localhost:3000
server-port = 3000